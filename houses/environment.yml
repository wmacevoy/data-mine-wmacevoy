channels:
  - conda-forge
dependencies:
  - python=3.11
  - jupyterlab
  - ipykernel
  - nodejs
  # Core R & tools (explicit, avoid r-essentials to reduce conflicts)
  - r-base=4.4
  - r-irkernel
  - r-languageserver
  # Plotting & data wrangling
  - r-tidyverse
  - r-ggplot2
  - r-ggally
  - r-corrplot
  - r-gridextra
  - r-scales
  - r-patchwork
  - r-ggstats
  - r-s7
  - r-data.table
  # (Optional) nice-to-haves
  - pandoc
  - quarto
  - tectonic
  - latexmk
