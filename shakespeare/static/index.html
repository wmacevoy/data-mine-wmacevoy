<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shakespeare Assistant</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; max-width: 800px; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    textarea { width: 100%; height: 100px; }
    .controls { margin: 1rem 0; display: flex; gap: .5rem; align-items: center; }
    .results { white-space: pre-wrap; border: 1px solid #ddd; padding: 1rem; border-radius: 8px; background: #fafafa; }
    .meta { color: #666; font-size: .9rem; }
  </style>
  <script>
    const API_BASE = new URLSearchParams(location.search).get('api') || 'http://localhost:8000';
    async function ask() {
      const q = document.getElementById('q').value.trim();
      const k = parseInt(document.getElementById('k').value || '5', 10);
      if (!q) { return; }
      setStatus('Querying...');
      try {
        const res = await fetch(`${API_BASE}/ask`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, k })
        });
        const data = await res.json();
        document.getElementById('answer').textContent = data.answer || '';
        const lines = (data.results || []).map(r => `• (${(r.score ?? 0).toFixed?.(3) ?? ''}) ${r.text?.slice(0, 200) || ''}${r.origin ? `\n   ⟶ ${r.origin} [#${r.index}]` : ''}`);
        document.getElementById('results').textContent = lines.join('\n\n');
        setStatus('');
      } catch (e) {
        setStatus('Error: ' + e);
      }
    }
    async function health() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        alert('API health: ' + JSON.stringify(data));
      } catch (e) { alert('Error: ' + e); }
    }
    function setStatus(msg) { document.getElementById('status').textContent = msg; }
  </script>
</head>
<body>
  <header>
    <h1>Shakespeare Assistant</h1>
    <nav><a href="/admin.html">Admin</a></nav>
  </header>
  <div class="meta">API: <code id="api">http://localhost:8000</code> (override with <code>?api=...</code>)</div>
  <p>Ask a question. Retrieval uses hybrid local index or Postgres if configured.</p>
  <textarea id="q" placeholder="Where can I see Macbeth in Colorado this summer?"></textarea>
  <div class="controls">
    <label>Top K <input id="k" type="number" min="1" max="20" value="5"></label>
    <button onclick="ask()">Ask</button>
    <button onclick="health()">Health</button>
    <span id="status"></span>
  </div>
  <h3>Answer</h3>
  <div class="results" id="answer"></div>
  <h3>Retrieved Context</h3>
  <div class="results" id="results"></div>
</body>
</html>
