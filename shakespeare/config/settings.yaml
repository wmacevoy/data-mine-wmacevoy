app:
  title: "Shakespeare Festival Assistant"
  host: "0.0.0.0"
  port: 8000

debug: true

logging:
  dir: "logs"
  embed_file: "embedding.log"

# Generation model selector
# - Use "mock" for offline/basic template responses
# - Use "openai-<model_name>" to call OpenAI Chat Completions
generation:
  model: "mock"  # e.g., "openai-gpt-4o-mini"

retrieval:
  top_k: 5
  method: "hybrid"  # hybrid = sparse TF-IDF + dense LSA
  weights:
    sparse: 0.5
    dense: 0.5
  dense_dim: 256

data:
  raw_dir: "data/raw"
  processed_file: "data/processed/corpus.txt"
  embeddings_dir: "data/embeddings"
data:
  raw_dir: data/raw
  processed_dir: data/processed

embeddings:
  # method: tfidf | openai
  method: tfidf
  # When method=openai, pick an OpenAI embedding model
  # e.g., text-embedding-3-small | text-embedding-3-large
  model: text-embedding-3-small

retrieval:
  top_k: 5

app:
  host: 0.0.0.0
  port: 8000
