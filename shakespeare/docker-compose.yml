services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: private/secrets.env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./private:/app/private
    depends_on:
      - db
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  static:
    image: nginx:alpine
    volumes:
      - ./static:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - app


